openapi: 3.0.3
info:
  title: PRUNplanner API
  version: 1.0.0
  description: |-
    API endpoints for PRUNplanner.org allowing Empire and Base planning and management.

    Scripts and sheets authenticate with an API key, created on the API Keys page: either as the header `Authorization: Api-Key <KEY>` or as the query parameter `?api_key=<KEY>` (for tools that only take a URL, such as Google Sheets `IMPORTDATA`). A key has full access to your account, so anyone who can see a URL with your key can use it. Revoke a key you no longer need.
paths:
  /analytics/planet_insights/{planet_natural_id}/:
    get:
      operationId: analytics_planet_insights_retrieve
      summary: Fetch planet insights by Planet Natural Id
      parameters:
      - in: path
        name: planet_natural_id
        schema:
          type: string
        required: true
      tags:
      - analytics
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsPlanAggregate'
          description: ''
  /analytics/planning_insights/materials/:
    get:
      operationId: analytics_planning_insights_materials_retrieve
      summary: Fetch planning insights for materials
      tags:
      - analytics
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsMarketInsight'
              examples:
                MaterialInsightsExample:
                  value:
                  - - AAR
                    - 30.3584
                    - 12.8593
                    - 17.4991
                  - - ABH
                    - 120.7919
                    - 0.0
                    - 120.7919
                  summary: Example for positional array response
          description: ''
  /client-errors/:
    post:
      operationId: client_errors_create
      description: Error reports from the frontend, logged as client_error (joined
        to the failed call by failed_request_id).
      summary: Report a frontend error
      tags:
      - client-errors
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientError'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ClientError'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ClientError'
        required: true
      responses:
        '204':
          description: No response body
  /data/buildings/:
    get:
      operationId: data_buildings_list
      summary: List all buildings
      tags:
      - data
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GameBuilding'
          description: ''
  /data/cxpc/{ticker}/:
    get:
      operationId: exchange_cxpc_all
      description: One ticker's full history. For many tickers, use `/data/cxpc/daily/`
        (every ticker's daily bars in one request). Limited to 120 requests per minute
        per IP across both per-ticker routes.
      summary: Get ticker CXPC data (All Exchanges)
      parameters:
      - in: path
        name: ticker
        schema:
          type: string
        required: true
      tags:
      - data
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GameExchangeCXPC'
          description: ''
  /data/cxpc/{ticker}/{exchange_code}/:
    get:
      operationId: exchange_cxpc_specific
      description: One ticker's full history. For many tickers, use `/data/cxpc/daily/`
        (every ticker's daily bars in one request). Limited to 120 requests per minute
        per IP across both per-ticker routes.
      summary: Get ticker CXPC data for specific Exchange
      parameters:
      - in: path
        name: exchange_code
        schema:
          type: string
        required: true
      - in: path
        name: ticker
        schema:
          type: string
        required: true
      tags:
      - data
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GameExchangeCXPC'
          description: ''
  /data/cxpc/daily/:
    get:
      operationId: exchange_cxpc_daily
      description: |-
        Every ticker's daily bars of a range of UTC days, ordered by date_epoch, exchange_code, ticker. Give either `days` (the last N days up to today) or `since` (and optionally `until`, default today). At most 31 days with `exchange`, 7 days without. Limited to 30 requests per minute per IP, JSON and CSV together; one request per exchange is all a daily refresh needs.

        Google Sheets: `=IMPORTDATA("https://api.prunplanner.org/data/cxpc/daily/csv/?days=7&exchange=AI1")`

        curl: `curl "https://api.prunplanner.org/data/cxpc/daily/?since=2026-10-01&until=2026-10-07"`
      summary: Get every ticker's daily CXPC data for a range of days
      parameters:
      - in: query
        name: days
        schema:
          type: integer
          maximum: 31
          minimum: 1
        description: The last N days up to today (UTC). Either since or days.
      - in: query
        name: exchange
        schema:
          enum:
          - AI1
          - CI1
          - IC1
          - NC1
          - UNIVERSE
          type: string
          x-spec-enum-id: 7826e655ee20e313
          minLength: 1
        description: |-
          Default all exchanges

          * `AI1` - AI1
          * `CI1` - CI1
          * `IC1` - IC1
          * `NC1` - NC1
          * `UNIVERSE` - UNIVERSE
      - in: query
        name: since
        schema:
          type: string
          format: date
        description: First day (UTC), inclusive. Either since or days.
      - in: query
        name: until
        schema:
          type: string
          format: date
        description: Last day (UTC), inclusive; with since, default today
      tags:
      - data
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CXPCDaily'
          description: ''
  /data/cxpc/daily/csv/:
    get:
      operationId: exchange_cxpc_daily_csv
      description: |-
        Every ticker's daily bars of a range of UTC days, ordered by date_epoch, exchange_code, ticker. Give either `days` (the last N days up to today) or `since` (and optionally `until`, default today). At most 31 days with `exchange`, 7 days without. Limited to 30 requests per minute per IP, JSON and CSV together; one request per exchange is all a daily refresh needs.

        Google Sheets: `=IMPORTDATA("https://api.prunplanner.org/data/cxpc/daily/csv/?days=7&exchange=AI1")`

        curl: `curl "https://api.prunplanner.org/data/cxpc/daily/?since=2026-10-01&until=2026-10-07"`
      summary: Get every ticker's daily CXPC data for a range of days (CSV)
      parameters:
      - in: query
        name: days
        schema:
          type: integer
          maximum: 31
          minimum: 1
        description: The last N days up to today (UTC). Either since or days.
      - in: query
        name: exchange
        schema:
          enum:
          - AI1
          - CI1
          - IC1
          - NC1
          - UNIVERSE
          type: string
          x-spec-enum-id: 7826e655ee20e313
          minLength: 1
        description: |-
          Default all exchanges

          * `AI1` - AI1
          * `CI1` - CI1
          * `IC1` - IC1
          * `NC1` - NC1
          * `UNIVERSE` - UNIVERSE
      - in: query
        name: since
        schema:
          type: string
          format: date
        description: First day (UTC), inclusive. Either since or days.
      - in: query
        name: until
        schema:
          type: string
          format: date
        description: Last day (UTC), inclusive; with since, default today
      tags:
      - 'data : csv'
      responses:
        '200':
          content:
            text/csv:
              schema:
                type: string
              examples:
                CSVExample:
                  value: |
                    ticker,exchange_code,date_epoch,open_p,close_p,high_p,low_p,volume,traded
                    DW,AI1,1793145600000,72.0,73.5,74.0,71.0,147000.0,2000.0
                    RAT,AI1,1793145600000,58.0,58.0,59.0,57.5,290000.0,5000.0
                  summary: CSV Example
          description: ''
  /data/cxpc/spark/{exchange_code}/:
    get:
      operationId: exchange_cxpc_sparklines
      summary: 'Get VWAP sparklines of every ticker for an Exchange: daily up to today,
        or VWAP 7D up to yesterday'
      parameters:
      - in: query
        name: days
        schema:
          type: integer
          maximum: 90
          minimum: 1
          default: 30
      - in: path
        name: exchange_code
        schema:
          type: string
        required: true
      - in: query
        name: metric
        schema:
          enum:
          - vwap_daily
          - vwap_7d
          type: string
          x-spec-enum-id: ec800711d13f1704
          default: vwap_daily
          minLength: 1
        description: |-
          vwap_daily: VWAP of the day, up to today; vwap_7d: trailing 7 days VWAP, up to yesterday

          * `vwap_daily` - vwap_daily
          * `vwap_7d` - vwap_7d
      - in: query
        name: tickers
        schema:
          type: string
          minLength: 1
        description: Comma separated, at most 50; unknown tickers are ignored
      tags:
      - data
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CXPCSparklines'
          description: ''
  /data/exchanges/:
